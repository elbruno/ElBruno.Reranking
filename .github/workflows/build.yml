name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore src/ElBruno.Reranking.Tests/ElBruno.Reranking.Tests.csproj
          dotnet restore src/ElBruno.Reranking.BlazorComponents.Tests/ElBruno.Reranking.BlazorComponents.Tests.csproj
          dotnet restore src/samples/BlazorRerankingDemo/BlazorRerankingDemo.csproj

      - name: Build
        run: |
          dotnet build src/ElBruno.Reranking/ElBruno.Reranking.csproj --no-restore
          dotnet build src/ElBruno.Reranking.BlazorComponents/ElBruno.Reranking.BlazorComponents.csproj --no-restore
          dotnet build src/ElBruno.Reranking.Tests/ElBruno.Reranking.Tests.csproj --no-restore
          dotnet build src/ElBruno.Reranking.BlazorComponents.Tests/ElBruno.Reranking.BlazorComponents.Tests.csproj --no-restore
          dotnet build src/samples/BlazorRerankingDemo/BlazorRerankingDemo.csproj --no-restore

      - name: Test
        run: |
          dotnet test src/ElBruno.Reranking.Tests/ElBruno.Reranking.Tests.csproj --no-build --framework net8.0 --verbosity normal --logger "trx;LogFileName=core-test-results.trx"
          dotnet test src/ElBruno.Reranking.BlazorComponents.Tests/ElBruno.Reranking.BlazorComponents.Tests.csproj --no-build --framework net8.0 --verbosity normal --logger "trx;LogFileName=blazor-test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*test-results.trx"
